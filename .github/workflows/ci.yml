name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrations apply cleanly
        run: ENGINE_DATABASE_URL=sqlite:////tmp/ci.db alembic upgrade head
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api + worker images
        run: |
          docker build --target api -t los-engine-api:ci .
          docker build --target worker -t los-engine-worker:ci .
