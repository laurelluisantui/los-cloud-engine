name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrations apply cleanly
        run: ENGINE_DATABASE_URL=sqlite:////tmp/ci.db alembic upgrade head
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api + worker images
        run: |
          docker build --target api -t los-engine-api:ci .
          docker build --target worker -t los-engine-worker:ci .

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Trust is safe ONLY for this disposable, runner-local CI service;
        # production always requires a strong password and a non-bypass role.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: los_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d los_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Create non-bypass app role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres@localhost:5432/los_ci", autocommit=True) as conn:
              conn.execute("CREATE ROLE los_ci LOGIN")
              conn.execute("ALTER DATABASE los_ci OWNER TO los_ci")
          PY
      - name: Migrate and test real PostgreSQL RLS
        env:
          ENGINE_DATABASE_URL: postgresql+psycopg://los_ci@localhost:5432/los_ci
        run: |
          alembic upgrade head
          python scripts/verify_postgres_rls.py

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set ephemeral database passwords
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for name in ("ENGINE_DB_ADMIN_PASSWORD", "ENGINE_DB_PASSWORD"):
                  env.write(f"{name}={secrets.token_urlsafe(32)}\n")
          PY
      - name: Start API, worker, and PostgreSQL
        run: docker compose up --build -d
      - name: Check health and unauthenticated denial
        run: |
          for i in $(seq 1 45); do
            if curl --silent --fail http://localhost:8000/healthz > /tmp/los-healthz; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          from urllib.request import urlopen
          with urlopen("http://localhost:8000/healthz", timeout=5) as r:
              assert json.load(r)["ok"] is True
          PY
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/v1/agents)
          test "$code" = 401
      - name: Show startup diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 api worker db
